name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            channel: windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            channel: linux-x64
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            channel: linux-arm64
          - os: macos-15-intel
            rid: osx-x64
            channel: macos-x64
          - os: macos-14
            rid: osx-arm64
            channel: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test --configuration Release
      - name: Publish GUI
        run: dotnet publish src/AmiCompanion.Gui/AmiCompanion.Gui.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output dist/AmiCompanion
      - name: Publish CLI
        run: dotnet publish src/AmiCompanion.Cli/AmiCompanion.Cli.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true --output dist/AmiCompanion
      - name: Write release metadata
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          printf 'AmiCompanion %s\nGit tag: %s\nCommit: %s\nRuntime: %s\n' "$VERSION" "$GITHUB_REF_NAME" "$GITHUB_SHA" "${{ matrix.rid }}" > dist/AmiCompanion/RELEASE.txt
          cd dist/AmiCompanion
          if command -v sha256sum >/dev/null 2>&1; then
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          else
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          fi
      - name: Create macOS app bundle
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        shell: bash
        run: |
          chmod +x packaging/macos/package.sh
          packaging/macos/package.sh dist/AmiCompanion dist/macos "${GITHUB_REF_NAME#v}"
          ditto -c -k --sequesterRsrc --keepParent dist/macos/AmiCompanion.app "dist/AmiCompanion-${GITHUB_REF_NAME#v}-${{ matrix.rid }}.zip"
      - name: Upload macOS app
        if: ${{ startsWith(matrix.rid, 'osx-') }}
        uses: actions/upload-artifact@v4
        with:
          name: AmiCompanion-package-${{ matrix.rid }}
          path: dist/AmiCompanion-*.zip
          if-no-files-found: error
      - name: Create native archive
        shell: bash
        run: |
          mkdir -p dist/packages
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/AmiCompanion/*' -DestinationPath 'dist/packages/AmiCompanion-$VERSION-${{ matrix.rid }}.zip'"
          elif [[ "${{ matrix.rid }}" == linux-* ]]; then
            tar -C dist -czf "dist/packages/AmiCompanion-$VERSION-${{ matrix.rid }}.tar.gz" AmiCompanion
          fi
      - name: Upload native archive
        if: ${{ startsWith(matrix.rid, 'win-') || startsWith(matrix.rid, 'linux-') }}
        uses: actions/upload-artifact@v4
        with:
          name: AmiCompanion-package-${{ matrix.rid }}
          path: dist/packages/*
          if-no-files-found: error
      - name: Upload package input
        uses: actions/upload-artifact@v4
        with:
          name: AmiCompanion-${{ matrix.rid }}
          path: dist/AmiCompanion
          if-no-files-found: error

  itch:
    needs: build
    if: ${{ vars.ITCH_PROJECT != '' }}
    strategy:
      matrix:
        include:
          - artifact: AmiCompanion-win-x64
            channel: windows-x64
          - artifact: AmiCompanion-linux-x64
            channel: linux-x64
          - artifact: AmiCompanion-linux-arm64
            channel: linux-arm64
          - artifact: AmiCompanion-osx-x64
            channel: macos-x64
          - artifact: AmiCompanion-osx-arm64
            channel: macos-arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: package
      - name: Install butler
        run: |
          curl -L -o butler.zip https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip butler.zip
          chmod +x butler
      - name: Validate package
        run: ./butler validate package
      - name: Publish to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: ./butler push package "${{ vars.ITCH_PROJECT }}:${{ matrix.channel }}" --userversion "${GITHUB_REF_NAME#v}"
