name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore AmiCompanion.slnx
      - name: Build
        run: dotnet build AmiCompanion.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test AmiCompanion.slnx --configuration Release --no-build
